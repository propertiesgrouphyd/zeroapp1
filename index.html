<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>
Zero App - Watch & Share Short Videos
</title>

<meta
name="description"
content="Zero App is a modern short video community where people watch, discover and share reels, shorts and trending videos in a beautiful full-screen experience.">

<meta
name="keywords"
content="Zero App, Short Videos, Reels, Viral Videos, Trending Videos, Watch Videos, Share Videos, Video Community, Shorts Platform">

<meta
name="robots"
content="index,follow,max-image-preview:large">

<meta
name="author"
content="Zero App">

<meta
name="theme-color"
content="#000000">

<meta
name="color-scheme"
content="dark">

<link
rel="canonical"
href="https://zeroapp.vidhwaan.com/">

<!-- ==========================================
OPEN GRAPH
========================================== -->

<meta
property="og:type"
content="website">

<meta
property="og:title"
content="Zero App - Watch & Share Short Videos">

<meta
property="og:description"
content="Watch trending short videos and share your own content with the Zero App community.">

<meta
property="og:url"
content="https://zeroapp.vidhwaan.com/">

<meta
property="og:site_name"
content="Zero App">

<meta
property="og:image"
content="https://zeroapp.vidhwaan.com/icons/icon-512.png">

<meta
property="og:image:width"
content="512">

<meta
property="og:image:height"
content="512">

<meta
property="og:image:type"
content="image/png">

<!-- ==========================================
TWITTER / X
========================================== -->

<meta
name="twitter:card"
content="summary_large_image">

<meta
name="twitter:title"
content="Zero App - Watch & Share Short Videos">

<meta
name="twitter:description"
content="Discover trending reels and share your own short videos.">

<meta
name="twitter:image"
content="https://zeroapp.vidhwaan.com/icons/icon-512.png">

<!-- ==========================================
PWA
========================================== -->

<meta
name="mobile-web-app-capable"
content="yes">

<meta
name="apple-mobile-web-app-capable"
content="yes">

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta
name="apple-mobile-web-app-title"
content="Zero App">

<link
rel="manifest"
href="./manifest.json">

<!-- ==========================================
ICONS
========================================== -->

<link
rel="icon"
type="image/png"
sizes="512x512"
href="./icons/icon-512.png">

<link
rel="apple-touch-icon"
href="./icons/icon-192.png">

<!-- ==========================================
FONTS
========================================== -->

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<!-- ==========================================
STRUCTURED DATA
========================================== -->

<script type="application/ld+json">
{
 "@context":"https://schema.org",
 "@type":"WebSite",
 "name":"Zero App",
 "url":"https://zeroapp.vidhwaan.com",
 "description":"Watch and share short videos in a full-screen vertical feed experience.",
 "publisher":{
   "@type":"Organization",
   "name":"Zero App",
   "logo":{
     "@type":"ImageObject",
     "url":"https://zeroapp.vidhwaan.com/icons/icon-512.png"
   }
 }
}
</script>

<link
rel="stylesheet"
href="./css/style.css">

</head>


<body>

<!-- APP -->

<div id="app">

<main
id="feed"
class="feed">

<!-- Content injected by JS -->

</main>

</div>

<!-- Loader -->

<div
id="loader"
class="loader">

<div class="loader-logo">

<img
src="./icons/logo.png"
alt="Zero App">

</div>

<div class="loader-text">

Loading...

</div>

</div>

<!-- Add Button -->

<button
id="addBtn"
class="fab"
aria-label="Add App">

+

</button>

<!-- Install Button -->

<button
id="installBtn"
class="install-btn"
aria-label="Install App">

📥

</button>

<!-- Upload Modal -->

<div
id="uploadModal"
class="modal hidden">

<div class="modal-backdrop"></div>

<div class="modal-card">

<div class="modal-header">

<h2>
Add Video
</h2>

<button
id="closeModal"
class="close-btn">

✕

</button>

</div>

<div class="modal-body">

<input
id="username"
type="text"
maxlength="50"
placeholder="Your Name">

<input
id="shortUrl"
type="url"
placeholder="Short Video Link">

<button
id="submitVideo"
class="submit-btn">

Add Video

</button>

<div
id="uploadStatus"
class="upload-status">
</div>

</div>

</div>

</div>

<!-- Empty State -->

<div
id="emptyState"
class="empty-state hidden">

<img
src="./icons/logo.png"
alt="Zero App">

<h2>
No Apps Yet
</h2>

<p>
Discover and explore amazing apps.
</p>

</div>

<!-- Toast -->

<div
id="toast"
class="toast hidden">
</div>

<!-- Scripts -->

<script
type="module"
src="./js/firebase-config.js?v2">
</script>

<script
type="module"
src="./js/feed.js?v2">
</script>

</body>
</html>
