name: QuantumFeed Deploy

on:
  push:
    branches:
      - main

  workflow_run:
    workflows:
      - "Zero App Daily Export"
    types:
      - completed

  workflow_dispatch:

jobs:

  deploy:

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PROJECT_NAME: quantumfeed

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Build Tools
        run: |
          npm install -g terser
          npm install -g clean-css-cli
          npm install -g html-minifier-terser
          npm install -g wrangler

      - name: Prepare Dist Folder
        run: |
          rm -rf dist

          mkdir -p dist
          mkdir -p dist/css
          mkdir -p dist/js
          mkdir -p dist/data

          cp index.html dist/
          cp manifest.json dist/
          cp sw.js dist/
          cp favicon.ico dist/

          cp -r icons dist/

          cp css/style.css dist/css/
          cp js/firebase-config.js dist/js/
          cp js/feed.js dist/js/

          cp -r data/* dist/data/


      - name: Verify Dist Data
        run: |
          echo "===== DIST FILES ====="
          find dist -type f | sort

          echo ""
          echo "===== DATA ====="
          ls -la dist/data

          echo ""
          echo "===== latest.json ====="
          cat dist/data/latest.json

          echo ""
          echo "===== videos ====="
          cat dist/data/videos-*.json   

      - name: Minify HTML
        run: |
          find dist -type f -name "*.html" | while read file
          do
            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-tag-whitespace \
              --use-short-doctype \
              --minify-css true \
              --minify-js true \
              "$file" \
              -o "$file"
          done

      - name: Minify CSS
        run: |
          find dist -type f -name "*.css" | while read file
          do
            cleancss \
              -O2 \
              "$file" \
              -o "$file"
          done

      - name: Minify JavaScript
        run: |
          find dist -type f -name "*.js" | while read file
          do
            terser "$file" \
              --compress \
              --mangle \
              -o "$file"
          done

      - name: Generate Build Version
        run: |
          echo "BUILD_VERSION=$(date +%s)" >> $GITHUB_ENV

      - name: Inject Cache Busting
        run: |
          find dist -type f -name "*.html" | while read file
          do
            sed -i "s|css/style.css|css/style.css?v=${BUILD_VERSION}|g" "$file"
            sed -i "s|js/firebase-config.js|js/firebase-config.js?v=${BUILD_VERSION}|g" "$file"
            sed -i "s|js/feed.js|js/feed.js?v=${BUILD_VERSION}|g" "$file"
            sed -i "s|manifest.json|manifest.json?v=${BUILD_VERSION}|g" "$file"
          done



      - name: Wrangler Version
        run: |
          wrangler --version



      - name: Create Cloudflare Project If Missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! wrangler pages project list | grep -q "$PROJECT_NAME"
          then
            echo "Creating Cloudflare Pages Project..."

            wrangler pages project create "$PROJECT_NAME" \
              --production-branch main

          else
            echo "Project already exists."
          fi

      - name: Deploy To Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --commit-dirty=true

      - name: Deployment Success
        run: |
          echo "QUANTUMFEED DEPLOYED SUCCESSFULLY"
